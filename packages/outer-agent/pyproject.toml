[project]
name = "coa-outer-agent"
version = "0.3.5"
description = "Thin orchestration runtime for semantic planning and native source retrieval"
requires-python = ">=3.12"

dependencies = [
    "coa-common",
    "bedrock-agentcore==1.18.1",
    "boto3>=1.35",
    "httpx>=0.27",
    "mcp>=1.28.1,<2",
    "pydantic>=2.13.4",
    "PyJWT>=2.13.0",
    "structlog>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_outer_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
]

[tool.uv.sources]
coa-common = { workspace = true }
